# nuScenes: LiDAR depth prior + DepthPro fill in holes (fuse mode)
scene:
  type: 'InTheWild'
  attributes:
    img_path: ''
  annotations_path: ''
  save_dir: '../experimental_results/nuScenes/'
  K: []
run:
  data_backend: 'py123d'
  use_enhancement: True
  only_foreground: False
  detection_source: 'gt'
  single_object: False
  reproject: False
  depth_edge_threshold: 0.0001
  amodal_completion: 'our'
  obj_rec: 'trellis'
  depth:
    source: 'fuse'
    fill: 'none'        # do not pre-fill LiDAR; vision fills holes after fusion
    fuse_align: true
    # Vision hole-fill: MoGe-2 metric (MoGe-3 not released yet — set estimator: moge3 later)
    estimator: 'moge2'            # moge2 | moge3 | moge1_depthpro
    moge_pretrained: 'Ruicheng/moge-2-vitl-normal'
    moge_resolution_level: 9
    # LiDAR↔vision fusion refinements
    soft_blend: true          # (1) confidence soft blend at LiDAR boundaries
    blend_radius: 3
    banded_align: true        # (2) distance-band scale alignment
    raster_mode: 'median'     # (3) robust rasterize (+ densify_radius)
    densify_radius: 1
    semantic_guide: true      # (4) sky/ground/object priors
    multiview_refine: true    # (5) surround cross-camera consistency
    edge_fill: true           # (6) edge-aware hole fill
    calib_refine: true        # (7) small (du,dv) projection refine
    calib_max_shift: 2
  py123d:
    dataset: 'nuscenes-mini'  # matches dataset/py123d_smoke/logs/nuscenes-mini_*
    split_type: 'val'
    camera_keys: 'all'
    lidar_key: 'merged'
    frame_index: null
    max_scenes: 5
  segmentation:
    holistic: 'locateanything'
    crop_refinement: 'oneformer'
    crop_refinement_pad: 0.15
    crop_refinement_min_area: 400
    fg_bg: 'gt'
    tagger: 'null'
    allowed_categories: ['car', 'person']
    locateanything:
      model_path: 'nvidia/LocateAnything-3B'
      generation_mode: 'hybrid'
      categories: ['person', 'car']
      min_mask_area: 1600
  calibration:
    intrinsics: 'gt'
    pose: 'gt'
  clip_bg: False
