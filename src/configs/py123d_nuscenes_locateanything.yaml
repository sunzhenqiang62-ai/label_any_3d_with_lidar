# nuScenes smoke/full with LocateAnything VLM detection (no GT 2D boxes for crops)
scene:
  type: 'InTheWild'
  attributes:
    img_path: ''
  annotations_path: ''
  save_dir: '../experimental_results/nuScenes/'
  K: []
run:
  data_backend: 'py123d'
  use_enhancement: True
  only_foreground: False
  detection_source: 'model'
  single_object: False
  reproject: False
  depth_edge_threshold: 0.0001
  amodal_completion: null  # smoke: skip InstructPix2Pix; use 'our' for full quality
  obj_rec: 'trellis'
  depth:
    source: 'fuse'       # LiDAR prior + MoGe-2 metric fill in holes
    fill: 'none'         # do not pre-fill LiDAR; vision fills after fusion
    fuse_align: true
    estimator: 'moge2'   # moge2 (default) | moge3 (when released) | moge1_depthpro
    # Prefer local ckpt when present; override via MOGE_PRETRAINED / run.depth.moge_pretrained
    moge_pretrained: '/mnt/cfs-baidu/public/chengyue.sun/workspace/LabelAny3d/external/checkpoints/moge-2-vitb-normal.pt'
    moge_resolution_level: 9
    soft_blend: true
    blend_radius: 3
    banded_align: true
    raster_mode: 'median'
    densify_radius: 1
    semantic_guide: true
    multiview_refine: true
    edge_fill: true
    calib_refine: true
    calib_max_shift: 2
  py123d:
    dataset: 'nuscenes-mini'
    split_type: 'val'
    camera_keys: 'all'
    lidar_key: 'merged'
    frame_index: null
    max_scenes: 1
  segmentation:
    holistic: 'locateanything'
    # Run OneFormer only inside each LocateAnything 2D box crop (not on full image).
    crop_refinement: 'oneformer'
    crop_refinement_pad: 0.15
    crop_refinement_min_area: 400
    fg_bg: 'gt'
    tagger: 'null'
    allowed_categories: ['car', 'person']
    locateanything:
      model_path: 'nvidia/LocateAnything-3B'
      generation_mode: 'hybrid'
      categories: ['person', 'car']
      min_mask_area: 1600
  calibration:
    intrinsics: 'gt'
    pose: 'gt'
  clip_bg: False
