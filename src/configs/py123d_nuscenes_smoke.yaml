scene:
  type: 'InTheWild'
  attributes:
    img_path: ''
  annotations_path: ''
  save_dir: '../experimental_results/nuScenes/'
  K: []
run:
  data_backend: 'py123d'
  use_enhancement: True
  only_foreground: True
  single_object: False
  reproject: False
  depth_edge_threshold: 0.0001
  amodal_completion: 'our'
  obj_rec: 'trellis'
  depth:
    source: 'py123d'
    fill: 'nearest'
  py123d:
    dataset: 'nuscenes'
    split_type: 'val'
    camera_key: 'CAM_FRONT'
    lidar_key: 'merged'
    frame_index: null
    max_scenes: 5
  segmentation:
    holistic: 'entityv2'
    fg_bg: 'clipseg'
    merge_masks:
      dilation: 7
      threshold: 0.5
    tagger: 'ovsam'
  calibration:
    intrinsics: 'gt'
    pose: 'gt'
  clip_bg: False
